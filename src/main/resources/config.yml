enabled: true

# أقصى مسافة للضربة (السيرفر الافتراضي 3.0)
reach: 3.0
# تسامح الاصطدام بالهيتبوكس
ray-tolerance: 0.1
# عدد التكات قبل التأكد أن الضربة ما انحسبت
check-delay-ticks: 2
# أقل شحن للسيف لتعويض الضربة (0.0 - 1.0) للاعبين الجافا
min-attack-cooldown: 0.0

bedrock:
  # يلغي الكرتكل عن لاعبين البيدروك (الضربة عادية)
  no-critical: true
  # مضاعف الدمج للبيدروك (1.0 = عادي، 0.8 = أقل)
  damage-multiplier: 1.0
  # لازم يكون السيف مشحون عشان ما يتدمج بالسبام
  min-attack-cooldown: 0.9
  # بادئة اسم لاعبين Floodgate
  name-prefix: "."
